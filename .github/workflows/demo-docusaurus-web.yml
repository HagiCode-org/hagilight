name: Deploy Hagilight Docusaurus demo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-demo-docusaurus-web
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: demo-docusaurus-web
      url: https://docusaurus.hagicode.com/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:docusaurus-example
        env:
          # 10-locale Docusaurus build exceeds the default ~4 GB heap on the runner.
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Publish Docusaurus demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./examples/demo-docusaurus-web/build
          publish_branch: demo-docusaurus-web
          force_orphan: true
          enable_jekyll: false
          cname: docusaurus.hagicode.com
