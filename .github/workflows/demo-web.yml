name: Deploy Hagilight core demo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-demo-web
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: demo-web
      url: https://hagilight.hagicode.com/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:core-footer-example
      - name: Publish core demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./examples/demo-web/dist
          publish_branch: demo-web
          force_orphan: true
          enable_jekyll: false
          cname: hagilight.hagicode.com
