name: Deploy Hagilight core demo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-demo-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:core-footer-example
      - name: Publish core demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./examples/demo-web/dist
          publish_branch: demo-web
          enable_jekyll: false
          cname: hagilight.hagicode.com
