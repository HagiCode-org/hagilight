name: Deploy Hagilight Starlight demo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-demo-starlight-web
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: demo-starlight-web
      url: https://hagistar.hagicode.com/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:example
      - name: Publish Starlight demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./examples/demo-starlight-web/dist
          publish_branch: demo-starlight-web
          enable_jekyll: false
          cname: hagistar.hagicode.com
