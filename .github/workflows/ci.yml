name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux, platform: linux }
          - { os: windows-latest, label: Windows, platform: windows }
          - { os: macos-latest, label: macOS, platform: macos }
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry
      - name: Build and type-check packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          pnpm run typecheck 2>&1 | tee .ci-artifacts/typecheck.log
      # `pnpm test` already runs real Astro and Docusaurus builds, so every OS gets that coverage.
      # The slower checks below do not depend on the OS and run on Linux only.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee .ci-artifacts/test.log
      - name: Build example variants
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:example 2>&1 | tee .ci-artifacts/build.log
      - name: Verify tarballs
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -o pipefail
          pnpm run pack:check 2>&1 | tee .ci-artifacts/pack.log
          pnpm run integration:installed 2>&1 | tee .ci-artifacts/integration.log
      - name: Install Chromium for viewport regression
        if: matrix.platform == 'linux'
        run: npx playwright install --with-deps chromium
      - name: Run desktop viewport regression
        if: matrix.platform == 'linux'
        shell: bash
        env:
          HAGILIGHT_ARTIFACT_DIR: .ci-artifacts/viewport
        run: |
          set -o pipefail
          pnpm run test:viewport 2>&1 | tee .ci-artifacts/viewport.log
      - name: Append validation summary
        if: always()
        shell: bash
        run: |
          echo "## Hagilight validate (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hagilight-validate-${{ matrix.platform }}-diagnostics
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
