name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux, platform: linux }
          - { os: windows-latest, label: Windows, platform: windows }
          - { os: macos-latest, label: macOS, platform: macos }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate packages and example
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          npm test 2>&1 | tee .ci-artifacts/test.log
          npm run build:example 2>&1 | tee .ci-artifacts/build.log
          npm run pack:check 2>&1 | tee .ci-artifacts/pack.log
          npm run integration:installed 2>&1 | tee .ci-artifacts/integration.log
      - name: Append validation summary
        if: always()
        shell: bash
        run: |
          echo "## Hagilight validate (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hagilight-validate-${{ matrix.platform }}-diagnostics
          path: .ci-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
